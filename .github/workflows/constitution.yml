name: Verify RustMC and Constitution adoption

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RustMC
        uses: actions/checkout@v4
        with:
          path: rustmc
      - name: Check out accepted WPAI Constitution
        uses: actions/checkout@v4
        with:
          repository: MrWizard94-Compile/Agents-Constitution
          ref: 5a990520d53969bb90b72a886bbc62cb7f1b63aa
          path: wpai-constitution
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and project adoption
        run: |
          python wpai-constitution/tools/validate-source.py
          python -m unittest discover -s rustmc/scripts -p 'test_*.py' -v
          python rustmc/scripts/check-constitution-adoption.py \
            --source wpai-constitution/tools/check-adoption.py --project rustmc
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format, lint, and test product crates
        working-directory: rustmc
        run: |
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.97.1 test --workspace --locked
